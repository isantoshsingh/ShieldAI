<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShieldAI Setup</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 400px; margin: 40px auto; padding: 0 20px; color: #1f2937; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #6b7280; }
    label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 4px; }
    input[type="text"] { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.875rem; box-sizing: border-box; }
    button { padding: 8px 16px; border: none; border-radius: 6px; font-size: 0.875rem; cursor: pointer; margin-top: 12px; }
    #activate { background-color: #4f46e5; color: white; }
    #activate:hover { background-color: #4338ca; }
    #deactivate { background-color: #ef4444; color: white; margin-left: 8px; }
    #deactivate:hover { background-color: #dc2626; }
    #status { margin-top: 16px; font-size: 0.875rem; font-weight: 500; }
    .success { color: #059669; }
    .error { color: #dc2626; }
    .info { color: #2563eb; }
  </style>
</head>
<body>
  <h1>ShieldAI Setup</h1>
  <p>Enter the extension token provided by your organisation administrator.</p>

  <div style="margin-top: 20px;">
    <label for="token">Extension Token</label>
    <input type="text" id="token" placeholder="Paste your token here">
  </div>

  <div>
    <button id="activate">Activate</button>
    <button id="deactivate">Deactivate</button>
  </div>

  <p id="status"></p>

  <script src="setup.js"></script>
</body>
</html>
